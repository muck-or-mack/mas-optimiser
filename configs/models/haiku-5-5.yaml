# Claude Haiku 5.5 on the Claude API, a cheap model for smoke tests.
# Keys are the benchmark's LLMConfig fields (benchmark/models.py); the API key
# is read from the environment variable named by api_key_env.
llm_provider: anthropic
llm_model: claude-haiku-5-5
api_key_env: ANTHROPIC_API_KEY
# Haiku 5.5 rejects any temperature other than its default of 1.
temperature: 1.0
# Thinking is on by default and its tokens count towards max_tokens. The
# benchmark's client passes no effort or thinking settings to this provider
# (benchmark/llm_client.py:74-82), so Haiku 5.5 runs at its default effort.
max_tokens: 16384
# US dollars per million tokens on the Claude API, from
# platform.claude.com/docs/en/about-claude/pricing (checked 26/10/2026). A call
# whose prompt is over long_prompt_tokens costs long_prompt_multiplier times
# these rates. cache_write is the five-minute cache rate; the agent does not
# use the one-hour cache.
pricing:
  input: 0.10
  output: 0.50
  cache_read: 0.01
  cache_write: 0.125
  long_prompt_tokens: 100000
  long_prompt_multiplier: 5
