# Smoke test: the starting harness with Claude Haiku 5.5 on the first five
# ITSM tasks, one attempt each. Run it with `mas-optimiser run smoke`; any
# option on the command line overrides a value here (`mas-optimiser run smoke
# --limit 1`). Every setting is explained in template.yaml; those left out
# here take their defaults.
model: haiku-5-5
domain: itsm
limit: 5
