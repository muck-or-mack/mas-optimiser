# A trial of the improvement loop, small enough to watch: three tasks of each
# set, one attempt, one round. It shows that the loop's parts connect; three
# tasks decide nothing, so the gate is not expected to accept anything.
# `mas-optimiser evolve evolve-smoke` runs it. Every setting is explained in
# template.yaml; those left out here take their defaults.
model: haiku-5-5
domain: itsm
concurrency: 3
trace: false
split: haiku-20-40-40
limit: 9
rounds: 1
# Text only, so that no code written by a model is run.
editable: [".md"]
