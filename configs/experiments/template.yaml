# Every setting of an experiment, each at its default. To make an experiment,
# copy this file under a new name in this folder, set model and domain,
# change what is needed and delete the rest: a setting left out takes its
# default. Run it by name with `mas-optimiser run <name>`, or with
# `mas-optimiser evolve <name>` for the improvement loop. Any option on the
# command line overrides the file.
#
# Each setting is explained in full, under its own name, on
#   https://mas-optimiser.readthedocs.io/en/latest/settings.html
# Those marked (planner) can be tried, with what they cost and show, on
#   https://mas-optimiser.readthedocs.io/en/latest/_static/planner.html

# ---------------------------------------------------------------- what is run

# The agent's model: a file in configs/models/ by name, or a path. It decides
# the scores, the cost and the speed of everything else. Must be set.
model:

# The model that reads the results and proposes changes (evolve only). A
# stronger one may propose better changes, at its own price for each round.
# Default: the agent's model.
proposer_model:

# The harness the agent runs, and the one the loop starts from: a folder
# under harnesses/ by name, or a path. Default: the benchmark's own agent.
harness: default

# The benchmark's domain, or a list of them: itsm, csm, hr. More domains
# give more tasks, so smaller gains can be found, at more cost. Must be set.
domain:

# The tools the agent is offered. all_tools: every tool of the domain's
# server, which every arm of an experiment is given. oracle: only the tools
# a task needs, as published results use. plus_5_tools, plus_10_tools,
# plus_15_tools: oracle and that many distractors. Default: all_tools.
mode: all_tools

# A split of the tasks from configs/splits/, by name. run takes
# <name>:<set> for one set (training, validation, test); evolve takes the
# name alone and uses all three. Another split puts other tasks in each set.
# Default: none, which for run is every task; evolve must be given one.
split:

# Only the first N tasks (run), or the first N of each set (evolve). Fewer
# tasks cost less and show less: for trials. Default: none, which is all.
limit:

# Only these tasks, by id: one id or a list (run only). Default: none.
task:

# ---------------------------------------------------------------- how it is run

# Attempts at each task. More attempts shrink the noise of every score, so
# smaller gains can be found, and multiply the cost. Default: 1. (planner)
attempts: 1

# Attempts in flight at once. Higher is faster until the model's rate limit
# or the domain's server becomes the limit. Scores do not change. Default: 4.
concurrency: 4

# Seconds one call to the model may wait for its answer before it is given
# up and sent again. Too low cuts off slow answers. Default: 300.
model_timeout: 300

# The most seconds, and the most calls to the model, one attempt may use.
# Past either it is ended and recorded as an error; past its seconds, the
# model service is asked first, as below. Lower stops runaway attempts
# sooner and may cut off long tasks. Defaults: 3600 and 100.
attempt_timeout: 3600
attempt_calls: 100

# An attempt that ends in an error or at its limit of seconds may be a
# service's doing and not the harness's: the service is asked, and once it
# answers the attempt is run again, at most attempt_retries times. The
# service is waited for at most service_wait seconds; past that the attempt
# counts for nothing and the command ends with an error. The roles that read
# and propose wait for their service as long. Defaults: 2 and 1800.
attempt_retries: 2
service_wait: 1800

# ---------------------------------------------------------------- what is recorded

# Send each attempt to Langfuse as a trace, when its keys are in .env.
# Scores do not change. Default: true.
trace: true

# Ask the model for a summary of its reasoning on every call, shown in the
# trace. It changes the agent's behaviour and cost: for demonstrations only.
# Default: false.
thinking_summary: false

# Anthropic's prompt caching: input that repeats from call to call is billed
# at the cheaper cache rate. The model receives the same input; only the
# cost falls. Does nothing with any other provider. Default: true.
prompt_caching: true

# A word added to the results folder's name, so that a variant of an
# experiment has a folder of its own. Letters, digits, - and _. Default: none.
label:

# The results folder of a run, in place of
# evaluations/<experiment>/<start time> (run only). Default: none.
out:

# ---------------------------------------------------------------- the improvement loop (evolve only)

# Rounds of the loop. Each round proposes and tests candidates; the gate's
# bar rises with each round, so a later round needs a larger gain.
# Default: 10. (planner)
rounds: 10

# Candidates proposed in each round. More search wider in a round, cost
# more, and raise the bar for every one of them. Default: 1. (planner)
candidates: 1

# The chance, over the whole experiment, of keeping a change that does
# nothing. Higher keeps more changes, more of them useless; lower needs
# larger gains. Above 0, below 1. Default: 0.05. (planner)
alpha: 0.05

# The filter. A candidate is run first on filter_share of the validation
# tasks and dropped there unless its score is above the current harness's by
# more than filter_threshold percentage points. A larger share spends more
# on weak candidates and drops fewer good ones by chance; 0 is no filter.
# Defaults: 0.5 and 0. (filter_share: planner)
filter_share: 0.5
filter_threshold: 0

# The pool. The share of the training tasks whose traces the proposing model
# may read in a round, and how it is picked from the tasks ranked by score:
# spread (evenly, one place further each round) or ends (the lowest and the
# highest). A larger share shows more evidence and costs more reading.
# Defaults: 0.5 and spread. (pool_share: planner)
pool_share: 0.5
pool_pick: spread

# The types of file in the harness folder a proposal may edit: .md is the
# agent's text, .py its code. With .py, code written by a model is run.
# Default: both.
editable: [".md", ".py"]

# Whether a person approves each change before it is first run. each: shown
# at the terminal and run after a yes. none: no one is asked, and with .py
# editable the command then needs --accept-unreviewed-code. Default: none.
approval: none
