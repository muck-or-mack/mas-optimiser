# Baseline: the starting harness with gpt-oss-20b, served on the machine that
# runs the tasks, on every task of the three domains, one attempt each, one
# evaluation per domain. Start the model's server first
# (`mas-optimiser server gpt-oss-20b`). Every setting is explained in
# template.yaml.
model: gpt-oss-20b
domain: [itsm, csm, hr]
mode: all_tools
attempts: 1
# As many at once as have been tried on one 48 GB card.
concurrency: 8
trace: false
thinking_summary: false
