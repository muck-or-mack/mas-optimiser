[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-optimiser"
dynamic = ["version"]
description = "Evolving the planning layer of a multi-agent system, tested on EnterpriseOps-Gym"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cameron McCormack" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "httpx",
    "langchain-anthropic",
    "langchain-core",
    "langfuse>=5.0.4",
    "python-dotenv",
    "pyyaml",
]

[project.scripts]
mas-optimiser = "mas_optimiser.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs the benchmark's servers or a real model; run with -m integration",
]

[tool.ruff]
line-length = 88
extend-exclude = ["src/mas_optimiser/_version.py", "vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "D"]
# D107: a constructor's arguments are documented on its class.
ignore = ["E501", "D107"]

[tool.ruff.lint.per-file-ignores]
# A test is documented by its name.
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# The benchmark's modules only resolve once mas_optimiser.benchmarks.enterpriseops
# has put the submodule on sys.path, so they sort after first-party imports.
section-order = ["future", "standard-library", "third-party", "first-party", "enterpriseops-gym", "local-folder"]
sections = { enterpriseops-gym = ["benchmark", "orchestrators"] }

# Every function's docstring names each argument, the return value and what
# it raises (Google style); types stay in the signature. Run it with
# `uvx pydoclint@0.12.0 src`: it stays out of the dev group because its
# docstring-parser-fork installs the same module as the docstring-parser the
# model client depends on, and whichever lands last overwrites the other.
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
require-return-section-when-returning-nothing = false
allow-init-docstring = true
exclude = "_version\\.py"

[tool.setuptools_scm]
version_file = "src/mas_optimiser/_version.py"
fallback_version = "0.0.0"

[tool.uv]
# uv only rebuilds the editable install when these change; the git keys keep
# the setuptools-scm version in step with new commits and tags.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.setuptools.packages.find]
where = ["src"]
