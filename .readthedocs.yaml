# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # The full history with its tags, so the version names a release.
      - git fetch --unshallow || true

# The benchmark is a submodule and the package imports it.
submodules:
  include: all

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev
